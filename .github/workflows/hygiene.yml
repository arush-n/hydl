name: hygiene

# Deliberately narrow. This workflow verifies publication boundaries and the
# lint contract on a clean runner.
#
# The test suites are contributor material and are not part of the publication
# set, so this workflow does not claim test coverage. If the suites become part
# of a release, add a test job that installs the declared dependencies and
# asserts that a nonzero test set was collected.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  publication-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Asserts that decompiled Hytale sources, plugin jars, server installs and
      # capture trees stay unpublishable, and that real source and documentation
      # stay trackable. Exits nonzero on either failure.
      - name: Publication hygiene
        run: python tools/check_publication_hygiene.py

      # Defense in depth: catch a decompiled tree even if the hygiene list is
      # incomplete.
      - name: No decompiled sources committed
        run: |
          if git ls-files | grep -E '(^|/)decompiled/' ; then
            echo "::error::decompiled Hytale sources are committed -- see LICENSE"
            exit 1
          fi
          echo "ok: no decompiled sources in the index"

      # The Gradle wrapper jar is the one deliberate exception: `.gitignore`
      # un-ignores it explicitly (`!hytale-plugin/gradle/wrapper/gradle-wrapper.jar`)
      # because `./gradlew` cannot bootstrap without it. Every other jar -- the
      # Hytale server, plugin build output, bridge artifacts -- stays out.
      - name: No jars committed (except the Gradle wrapper)
        run: |
          if git ls-files | grep -E '\.jar$' | grep -v -E '(^|/)gradle/wrapper/gradle-wrapper\.jar$' ; then
            echo "::error::jar files are committed"
            exit 1
          fi
          echo "ok: no jars in the index beyond the Gradle wrapper"

  # The gate that was missing. Hygiene and lint both passed while
  # `pip install -e .` could not be trusted, because nothing here ever built the
  # distribution -- the `license = "MIT"` / setuptools-floor mismatch was
  # invisible to both. This builds BOTH distributions and imports the result
  # from a clean environment, which is the only thing that proves an installable
  # release.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build

      - name: Build the root distribution
        run: python -m build --wheel --outdir dist/ .

      - name: Build the gym distribution
        run: python -m build --wheel --outdir dist-gym/ HytaleRL/hytalegym

      # Installed into the runner's environment and imported from a directory
      # that is NOT the checkout, so a module resolved from the source tree
      # instead of the wheel cannot pass by accident.
      - name: Install and import the built wheels
        run: |
          pip install dist/*.whl dist-gym/*.whl
          cd /tmp
          python -c "import arena, adk, console, npc, worlds, agents; print('packages import from the installed wheels')"

      # The Console's browser UI is 27 non-Python files. A wheel of .py alone
      # installs a Console whose every page 404s, which no import check sees.
      - name: The installed Console carries its UI
        working-directory: /tmp
        run: >-
          python -c "import pathlib,console;
          r=pathlib.Path(console.__file__).parent;
          m=[n for n in ('static/index.html','static/js/ladder.js') if not (r/n).is_file()];
          assert not m, f'missing from the wheel: {m}';
          print('console UI present in the installed package')"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PINNED. An unpinned linter makes this job's meaning change on the
      # linter's release schedule instead of on a commit, and it did: the first
      # run resolved a newer ruff whose default rule set had widened and
      # reported 655 errors against a tree that was clean. The ruleset is now
      # declared in `[tool.ruff.lint] select`, and the version is pinned so a
      # rule that fires here is one this repository chose.
      - run: pip install ruff==0.16.4
      # Keep this list in step with `[tool.ruff] include` in pyproject.toml so
      # every published Python tree is checked.
      - run: ruff check arena agents console tools adk npc worlds
