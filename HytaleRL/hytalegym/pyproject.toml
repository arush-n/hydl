[build-system]
# setuptools>=77 because `license = "MIT"` below is the PEP 639 STRING form,
# which older setuptools does not accept. The floor was >=68, so whether the
# build succeeded depended on whichever setuptools the environment happened to
# resolve -- it builds here on 70.2.0 and was reported failing elsewhere. A
# build that passes or fails on the toolchain rather than on this file is the
# same defect the ruff pin fixed.
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hytalegym"
version = "0.1.0"
description = "Gymnasium-compatible RL environments for Hytale"
# No `readme`: per-package docs were renamed to DEV.md on 2026-08-19 and are
# unpublished, so naming one here breaks the build in a clone. Restore as
# `readme = "README.md"` when a user-facing README exists.
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Arush" }
]

dependencies = [
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "msgpack>=1.0.0",
]

[project.optional-dependencies]
jax = [
    "jax>=0.4.35",
    "optax>=0.2.4",
]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.2",
    "stable-baselines3>=2.2.0",
]

[project.entry-points."gymnasium.envs"]
__root__ = "hytalegym.envs:register_envs"

[tool.setuptools.packages.find]
include = ["hytalegym*"]

[tool.setuptools.package-data]
# The simulator's per-generation content tables and the swap plan ship with the package (sim/README.md).
hytalegym = ["rulesets/**/*.json", "sim/*/data/*.json", "sim/common/content/*.json"]
