# Gradle 9.1+ can run on Java 25, so no machine-specific org.gradle.java.home
# is required. The Java toolchain remains pinned in build.gradle.kts.

# JVM flags for the Gradle daemon
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Enable the Gradle build cache
org.gradle.caching=true
